{% include "layout.html" %}

    <div class="container">
        <div class="card">
            <div class="card-header">
                <h1>Register</h1>
            </div>
            <div class="card-body">
                <form id="registerForm">
                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label>Email</label>
                            <input type="text" class="form-control" id="email" name="email" required autocomplete="email" required>
                        </div>
                        <div class="form-group col-md-6">
                            <label>Username</label>
                            <input type="text" class="form-control" name="username" required autocomplete="username">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label>First Name</label>
                            <input type="text" class="form-control"
                            name="firstname" required autocomplete="given-name">
                        </div>
                        <div class="form-group col-md-6">
                            <label>Last Name</label>
                            <input type="text" class="form-control" name="lastname" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label>Role</label>
                            <input type="text" class="form-control" name="role" required>
                        </div>
                        <div class="form-group col-md-6">
                            <label>Phone Number</label>
                            <input type="text" class="form-control" name="phone_number" autocomplete="phone_number" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" class="form-control" name="password" required autocomplete="new-password" required>
                    </div>
                    <div class="form-group">
                        <label>Veirfy Password</label>
                        <input type="password" class="form-control" name="password2" required autocomplete="new-password">
                    </div>
                    <button type="submit" class="btn btn-primary">Sign In</button>
                </form>
            </div>
            <div class="card-footer text-muted">
                <p>Already have an account? <a href="/auth/login-page">Login?</a></p>
            </div>
        </div>
    </div>
